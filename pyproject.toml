[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patho-bench-dl"
version = "0.2.0"
description = "Unified downloader for Patho-Bench datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.9.0",
    "aiolimiter>=1.1.0",
    "datasets>=3.6.0",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.2.1",
    "kaggle>=1.8.2",
    "pandas>=2.3.3",
    "requests>=2.28.0",
    "synapseclient>=4.10.0",
    "tcia-utils>=3.2.1",
    "tenacity>=8.0.0",
]

[project.scripts]
patho-bench-dl = "patho_bench_dl.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["patho_bench_dl*"]


